name: Tests

# Fast feedback: run the test suite on every push (any branch) and on PRs.
# Mirrors the "Run tests" job in release.yml.

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Qt platform deps (offscreen needs libxcb)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xkb1 libxkbcommon-x11-0

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-build.txt
          pip install pytest pytest-qt pytest-timeout

      - name: Run pytest
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONFAULTHANDLER: '1'
        # --timeout: a hung test fails with a stack dump of every thread
        # instead of blocking the job.
        run: pytest tests/ -v --timeout=120 --timeout-method=thread
